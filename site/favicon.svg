  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Constellation accents -->
  <circle cx="14" cy="14" r="0.9" fill="#F0C040" opacity="0.6"/>
  <circle cx="50" cy="18" r="0.7" fill="#F0C040" opacity="0.5"/>
  <circle cx="52" cy="46" r="0.8" fill="#F0C040" opacity="0.55"/>
  <circle cx="13" cy="50" r="0.6" fill="#F0C040" opacity="0.45"/>
  <!-- RS monogram in gold serif -->
  <text x="32" y="44" text-anchor="middle"
